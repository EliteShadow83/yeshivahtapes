<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Audio Library</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="manage-page">
    <section class="hero">
      <div>
        <p class="eyebrow">Private management</p>
        <h2>Upload or delete recordings.</h2>
        <p>This page is intentionally not linked from the public library. Access it directly at <strong>/manage.html</strong>.</p>
      </div>
      <form id="uploadForm" class="search-card">
        <label for="audioFiles">Upload audio files</label>
        <input id="audioFiles" name="audioFiles" type="file" accept="audio/*" multiple>
        <button class="ghost manage-button" type="submit">Upload selected files</button>
      </form>
    </section>

    <section id="message" class="status"></section>
    <section class="content">
      <div class="card">
        <p class="eyebrow">Current recordings</p>
        <h3>Delete files</h3>
        <p class="meta">Deleting removes the audio file from the library folder.</p>
      </div>
      <div id="fileList" class="grid"></div>
    </section>
  </main>
  <script src="/manage.js"></script>
</body>
</html>
