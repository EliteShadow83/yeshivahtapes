<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yeshivah Tapes Audio Library</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">♪</div>
        <div>
          <p class="eyebrow">Audio archive</p>
          <h1>Yeshivah Tapes</h1>
        </div>
      </div>
      <nav>
        <a href="#/" data-route="home">Library</a>
        <a href="#/albums" data-route="albums">Albums</a>
        <a href="#/speakers" data-route="speakers">Speakers</a>
      </nav>
    </aside>

    <main>
      <section class="hero">
        <div>
          <p class="eyebrow">Metadata-powered collection</p>
          <h2>Browse sermons, shiurim, music, and tapes by speaker or album.</h2>
          <p>Explore a polished, metadata-powered archive with dedicated pages, speaker and album collections, rich descriptions, and seamless playback.</p>
        </div>
        <div class="search-card">
          <label for="search">Search library</label>
          <input id="search" type="search" placeholder="Title, speaker, album, genre...">
        </div>
      </section>

      <section id="status" class="status"></section>
      <section id="app" class="content"></section>
    </main>
  </div>
  <script src="/app.js"></script>
</body>
</html>
